  <body>
    <div id="app">
      <header class="site-header" id="site-header">
        <div class="container header-inner">
          <a href="#/" class="brand-logo" id="brand-logo-btn">
            <div class="logo-symbol">
              <span class="sq-navy"></span>
              <span class="sq-orange"></span>
              <span class="sq-sky"></span>

            <div class="brand-text">

            </div>

        </div>
      </header>
      <main class="main-content" id="main-content-view">
        <section class="hero-section" id="hero-section">
          <div class="container hero-grid">
            <div class="hero-content">
              <div class="hero-kicker">ACCURATE &nbsp;|&nbsp; RELIABLE &nbsp;|&nbsp; ALWAYS FOR YOU</div>
              <h1 class="hero-title">
                Better Health Starts With<br />
                <span class="hero-title-highlight">Better Diagnosis</span>
              </h1>
              <p class="hero-description">
                Trusted diagnostic tests, expert analysis and convenient home sample collection – all in one place.
              </p>
              <div class="hero-action-row">
                <button class="btn-hero-primary" id="hero-book-btn">Book a Test</button>
                <a href="#packages-section" class="btn-hero-outline" id="hero-packages-btn">View Packages</a>
              </div>
            </div>
            <div class="hero-visual">
              <div class="hero-image-wrapper">
                <picture>
                  <source type="image/avif" srcset="/hero-doctor-sm.avif 400w, /hero-doctor.avif 800w" sizes="(max-width: 640px) 290px, 440px">
                  <source type="image/webp" srcset="/hero-doctor-sm.webp 400w, /hero-doctor.webp 800w" sizes="(max-width: 640px) 290px, 440px">
                  <source type="image/jpeg" srcset="/hero-doctor-sm.jpg 400w, /hero-doctor.jpg 800w" sizes="(max-width: 640px) 290px, 440px">
                  <img src="/hero-doctor.avif" alt="Pathologist Scientist" class="hero-doctor-img" width="440" height="480" fetchpriority="high" decoding="async" />
                </picture>
                <div class="hero-floating-quote">
                  <div class="quote-badge-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  </div>
                  <div class="quote-content">
                    <span class="quote-title">NABL Accredited</span>
                    <span class="quote-sub">10M+ Trusted Checks</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
